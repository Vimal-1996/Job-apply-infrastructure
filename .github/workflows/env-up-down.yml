name: env-up-down

# Bring the billable "runtime" stack of an environment up or down.
# Persistent resources (VPC, Cognito, ECR, ...) are never touched.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, staging]
        default: dev
      action:
        description: up = terraform apply, down = terraform destroy
        type: choice
        options: [up, down]
        default: up
  # Safety net: tear dev down every night (02:00 UTC) in case it was left running.
  schedule:
    - cron: "0 2 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: runtime-${{ inputs.env || 'dev' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'dev' }}
    env:
      ENV_NAME: ${{ inputs.env || 'dev' }}
      ACTION: ${{ inputs.action || 'down' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418272768931:role/job-apply-gha-infra-${{ env.ENV_NAME }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform ${{ env.ACTION }}
        working-directory: live/${{ env.ENV_NAME }}/runtime
        run: |
          terraform init -input=false
          if [ "$ACTION" = "up" ]; then
            terraform apply -input=false -auto-approve
          else
            terraform destroy -input=false -auto-approve
          fi
