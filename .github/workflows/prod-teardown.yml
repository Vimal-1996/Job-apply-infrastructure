name: prod-teardown

run-name: prod-teardown | requested by ${{ github.actor }}

# Removes the whole production environment (live/prod) to stop its costs
# between releases. Everything goes, including the database and the Cognito
# user pool with all users. Rebuild later with `terraform apply` in live/prod
# and the app repo's deploy-prod workflow (see docs/production.md).
#
# Run: Actions -> prod-teardown -> Run workflow on main, type "destroy prod".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy prod" to tear down production (database and users included)'
        required: true
        type: string

permissions:
  contents: read

# Never alongside another production change, and never cancelled halfway.
concurrency:
  group: prod-infra
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: prod # the AWS role trusts only this environment (main only)
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: live/prod
    env:
      TF_IN_AUTOMATION: "1"
      # Only used if Terraform needs the variable; it doesn't change what is destroyed.
      TF_VAR_alarm_email: ${{ vars.PROD_ALARM_EMAIL }}
    steps:
      - name: Check the request
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main (it was run from $GITHUB_REF)."; exit 1
          fi
          if [ "$CONFIRM" != "destroy prod" ]; then
            echo "::error::Confirmation didn't match. Type exactly: destroy prod"; exit 1
          fi
          if [ -z "$TF_VAR_alarm_email" ]; then
            echo "::error::Repository variable PROD_ALARM_EMAIL is not set."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418272768931:role/job-apply-gha-infra-prod
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - run: terraform init -input=false

      # Teardown starts with an apply. On an empty state that apply would BUILD
      # production, so stop here if there is nothing to tear down.
      - name: Is production running?
        id: state
        run: |
          COUNT=$(terraform state list | wc -l)
          echo "Resources in production state: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "Production is not running: nothing to tear down." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Plan - relax deletion protection
        if: steps.state.outputs.count != '0'
        run: |
          terraform plan -input=false -var allow_teardown=true -out=relax.tfplan
          # This step may only change settings, never add or remove resources.
          # (A replacement is fine: the task definition catching up to the deployed image.)
          terraform show -json relax.tfplan | jq -e '
            [.resource_changes[].change.actions
              | select(. == ["create"] or . == ["delete"])] | length == 0' >/dev/null \
            || { echo "::error::The relax plan would create or delete resources. Stopping."; exit 1; }

      - name: Apply - relax deletion protection
        if: steps.state.outputs.count != '0'
        run: terraform apply -input=false relax.tfplan

      - name: Plan - destroy
        if: steps.state.outputs.count != '0'
        run: |
          terraform plan -destroy -input=false -var allow_teardown=true -out=destroy.tfplan
          # A destroy plan must only delete.
          terraform show -json destroy.tfplan | jq -e '
            [.resource_changes[].change.actions
              | select(. != ["delete"] and . != ["no-op"] and . != ["read"])] | length == 0' >/dev/null \
            || { echo "::error::The destroy plan contains something other than deletions. Stopping."; exit 1; }
          N=$(terraform show -json destroy.tfplan | jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length')
          echo "Destroying $N production resources." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply - destroy
        if: steps.state.outputs.count != '0'
        run: terraform apply -input=false destroy.tfplan

      # AWS creates these log groups itself (container metrics, Lambda, database
      # logs), so Terraform doesn't remove them. They are recreated on rebuild.
      - name: Remove AWS-created log groups
        if: steps.state.outputs.count != '0'
        run: |
          for g in /aws/ecs/containerinsights/job-apply-prod/performance \
                   /aws/lambda/job-apply-prod-cognito-presignup \
                   /aws/rds/instance/job-apply-prod-pg/postgresql; do
            aws logs delete-log-group --log-group-name "$g" 2>/dev/null && echo "deleted $g" || true
          done

      - name: Check nothing billable is left
        run: |
          LEFT=""
          [ "$(terraform state list | wc -l)" -eq 0 ] || LEFT="$LEFT terraform-state"
          [ "$(aws ec2 describe-nat-gateways --filter Name=state,Values=available,pending Name=tag:Name,Values=job-apply-prod --query 'length(NatGateways)')" -eq 0 ] || LEFT="$LEFT nat-gateway"
          aws rds describe-db-instances --db-instance-identifier job-apply-prod-pg >/dev/null 2>&1 && LEFT="$LEFT database"
          [ -z "$(aws ecs describe-clusters --clusters job-apply-prod --query 'clusters[?status==`ACTIVE`].clusterName' --output text)" ] || LEFT="$LEFT ecs-cluster"
          [ -z "$(aws elbv2 describe-load-balancers --names job-apply-prod-api --query 'LoadBalancers[].LoadBalancerName' --output text 2>/dev/null)" ] || LEFT="$LEFT load-balancer"
          [ -z "$(aws cloudfront list-distributions --query 'DistributionList.Items[?starts_with(Comment, `job-apply-prod`)].Id' --output text)" ] || LEFT="$LEFT cloudfront"
          if [ -n "$LEFT" ]; then
            echo "::error::Still present:$LEFT" ; exit 1
          fi
          echo "Production is torn down: nothing billable left." | tee -a "$GITHUB_STEP_SUMMARY"
