name: prod-apply

run-name: prod-apply | ${{ inputs.mode }} | requested by ${{ github.actor }}

# Builds production from scratch, or applies infrastructure changes to it,
# from live/prod on main. Mode "plan" only shows what would change.
# After a fresh build, run the app repo's deploy-prod workflow (see
# docs/production.md). Tearing down is the separate prod-teardown workflow.
#
# Run: Actions -> prod-apply -> Run workflow on main.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan = show the changes only; apply = make them
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: 'For apply: type "apply prod"'
        required: false
        type: string

permissions:
  contents: read

# Never alongside another production change, and never cancelled halfway.
concurrency:
  group: prod-infra
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod # the AWS role trusts only this environment (main only)
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: live/prod
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_alarm_email: ${{ vars.PROD_ALARM_EMAIL }}
    steps:
      - name: Check the request
        working-directory: .
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main (it was run from $GITHUB_REF)."; exit 1
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "apply prod" ]; then
            echo "::error::For apply, type exactly: apply prod"; exit 1
          fi
          if [ -z "$TF_VAR_alarm_email" ]; then
            echo "::error::Repository variable PROD_ALARM_EMAIL is not set."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::418272768931:role/job-apply-gha-infra-prod
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - run: terraform init -input=false

      - name: Plan
        id: plan
        run: |
          FRESH=$([ "$(terraform state list | wc -l)" -eq 0 ] && echo true || echo false)
          echo "fresh=$FRESH" >> "$GITHUB_OUTPUT"
          # Protections always on here; only prod-teardown relaxes them.
          terraform plan -input=false -var allow_teardown=false -out=prod.tfplan
          terraform show -json prod.tfplan > plan.json

          # Never destroy data from this workflow: refuse any plan that deletes
          # or replaces the database, the user pool, the image registry or a bucket.
          jq -r '.resource_changes[]
                 | select(.type == "aws_db_instance" or .type == "aws_cognito_user_pool"
                          or .type == "aws_ecr_repository" or .type == "aws_s3_bucket")
                 | select(.change.actions | index("delete"))
                 | .address' plan.json > protected.txt
          if [ -s protected.txt ]; then
            echo "::error::This plan would delete or replace data-holding resources:"; cat protected.txt
            echo "Refused. If that's really intended, change it through a reviewed PR and apply by hand." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Plan for production$([ "$FRESH" = true ] && echo ' (fresh build)')"
            jq -r '[.resource_changes[] | .change.actions | join("/")] | group_by(.) | map("- \(.[0]): \(length)") | .[]' plan.json \
              | grep -v -e '- no-op:' -e '- read:' || echo "- no changes"
            echo
            echo '<details><summary>Changed resources</summary>'
            echo
            jq -r '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"])
                   | "- `\(.change.actions | join("/"))` \(.address)"' plan.json
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.mode == 'apply'
        run: terraform apply -input=false prod.tfplan

      - name: Next steps
        if: inputs.mode == 'apply'
        env:
          FRESH: ${{ steps.plan.outputs.fresh }}
        run: |
          URL=$(terraform output -raw url)
          {
            echo "### Production: $URL"
            if [ "$FRESH" = true ]; then
              echo "Fresh build. Production isn't serving yet:"
              echo "1. In Job-apply-enterprise-application, run **deploy-prod** on \`main\` (target \`all\`)."
              echo "2. Confirm the *AWS Notification – Subscription Confirmation* email so alerts arrive."
              echo "3. Create the first admin when needed (docs/production.md, *First-time setup*)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
